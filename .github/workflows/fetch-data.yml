name: Fetch ACS income data (manual)

# Re-run this whenever the Census Bureau publishes a new ACS 5-year release,
# to refresh public/pr_income_by_tract.json with the latest vintage.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-data.yml'
      - 'scripts/fetch-acs-income.mjs'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch ACS income data
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: node scripts/fetch-acs-income.mjs

      - name: Upload dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-income-data
          path: public/pr_income_by_tract.json

      - name: Commit refreshed dataset back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/pr_income_by_tract.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Refresh ACS income data [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
